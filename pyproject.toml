[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nirelle"
version = "0.1.0"
description = "Recency-weighted Bayesian Knowledge Tracing engine for Nirelle's mid-unit remediation loop."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = ["SQLAlchemy>=2.0"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.30", "pydantic>=2.0"]
llm = ["anthropic>=0.40"]
dev = ["pytest>=7.0", "httpx>=0.27", "fastapi>=0.110", "pydantic>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/nirelle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
