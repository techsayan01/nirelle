[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nirelle"
version = "0.1.0"
description = "Recency-weighted Bayesian Knowledge Tracing engine for Nirelle's mid-unit remediation loop."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/nirelle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
